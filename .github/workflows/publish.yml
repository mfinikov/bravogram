name: test and publish

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write # npm trusted publishing (and provenance)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build && node dist/bin/bravogram.js --version

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # the design system check (tokens, specs, docs freshness, types, lint), then the site build
      - run: npm ci
      - run: npm run check
      - run: npm run build

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing: npm trusts this workflow through GitHub's OIDC token, no NPM_TOKEN secret.
      # It needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      # npm refuses to publish a version twice, so only publish when package.json has a new version.
      - name: publish if this version is not on npm yet
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "bravogram@$v" version >/dev/null 2>&1; then
            echo "bravogram@$v is already on npm, nothing to publish. Bump the version to release."
          else
            npm publish --access public # prepublishOnly compiles TypeScript to dist/ first
          fi
